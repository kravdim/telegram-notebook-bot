services:
  bot:
    build:
      context: ../..
      dockerfile: platform/linux/Dockerfile
    init: true
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://notebook:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/notebook_bot
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?set EMBEDDING_API_KEY}
      ALLOW_ALL_USERS: ${ALLOW_ALL_USERS:-false}
      ALLOWED_TELEGRAM_IDS: ${ALLOWED_TELEGRAM_IDS:-[]}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-[]}
      BACKUP_DIR: /app/backups
      READINESS_FILE: /tmp/dailyplanner-ready.json
      READINESS_MAX_AGE_SECONDS: "20"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${DAILYPLANNER_CONFIG_PATH:-./config.docker.yaml}:/app/config.yaml:ro
      - backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: notebook_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook -d notebook_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  backups:
