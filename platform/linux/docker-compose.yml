services:
  bot:
    build:
      context: ../..
      dockerfile: platform/linux/Dockerfile
    restart: always
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://notebook:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/notebook_bot
      - BACKUP_DIR=/app/backups
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1, 0)'"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: notebook_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook -d notebook_bot"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pgdata:
  backups:
