name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://planner:planner@localhost:5432/planner_test
      BOT_TOKEN: ci-placeholder-not-a-token
      MINIMAX_API_KEY: ci-placeholder-not-a-key
      ALLOW_ALL_USERS: "true"
      RUN_DB_TESTS: "1"
      BACKUP_DIR: /tmp/dailyplanner-backups
      OPERATOR_DATABASE_URL: postgresql://planner_recovery:planner_recovery@localhost:5432/postgres
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Lint all supported code
        run: uv run ruff check .
      - name: Typecheck all production and operational code
        run: uv run mypy --explicit-package-bases bot scripts
      - name: Block medium/high-confidence security findings
        run: uv run bandit -q -r bot scripts -x bot/db/migrations -ll
      - name: Audit frozen production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt
      - run: uv run alembic upgrade head
      - name: Create least-privilege recovery operator
        run: |
          export PGPASSWORD=planner
          psql -h localhost -U planner -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE planner_recovery LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION PASSWORD 'planner_recovery'"
          createdb -h localhost -U planner --maintenance-db postgres \
            --template template0 dailyplanner_recovery_template
          psql -h localhost -U planner -d dailyplanner_recovery_template \
            -v ON_ERROR_STOP=1 -c \
            "BEGIN;
             ALTER ROLE planner_recovery SUPERUSER;
             SET ROLE planner_recovery;
             CREATE EXTENSION vector;
             CREATE EXTENSION pg_trgm;
             CREATE EXTENSION pgcrypto;
             RESET ROLE;
             ALTER ROLE planner_recovery NOSUPERUSER NOCREATEROLE NOREPLICATION;
             COMMIT"
          psql -h localhost -U planner -d postgres -v ON_ERROR_STOP=1 -c \
            "UPDATE pg_database SET datistemplate=true, datallowconn=false WHERE datname='dailyplanner_recovery_template'"
      - name: Require a single Alembic head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Test with coverage floor
        run: uv run pytest --cov --cov-report=term-missing
      - run: uv run python scripts/evaluate_llm_contracts.py
      - name: Create and restore a real backup
        run: |
          backup="$(uv run python -c 'import asyncio; from bot.scheduler.backup import run_backup; print(asyncio.run(run_backup()))')"
          uv run python scripts/restore_drill.py --backup "$backup"
      - run: uv run python scripts/secret_scan.py

  container-e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: container-smoke
      BOT_TOKEN: container-smoke
      OPENAI_API_KEY: container-smoke
      EMBEDDING_API_KEY: container-smoke
    steps:
      - uses: actions/checkout@v5
      - name: Build and wait for application readiness
        run: >-
          docker compose -p dailyplanner-ci
          -f platform/linux/docker-compose.yml
          -f platform/linux/docker-compose.smoke.yml
          up --build --wait --wait-timeout 240
      - name: Exercise the readiness probe explicitly
        run: docker exec dailyplanner-ci-bot-1 python scripts/container_healthcheck.py
      - name: Preserve container diagnostics
        if: always()
        run: >-
          docker compose -p dailyplanner-ci
          -f platform/linux/docker-compose.yml
          -f platform/linux/docker-compose.smoke.yml
          logs --no-color
      - name: Remove disposable containers and volumes
        if: always()
        run: >-
          docker compose -p dailyplanner-ci
          -f platform/linux/docker-compose.yml
          -f platform/linux/docker-compose.smoke.yml
          down --volumes --remove-orphans

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
