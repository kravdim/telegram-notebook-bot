name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  developer-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Reproduce documented developer database bootstrap
        run: scripts/bootstrap_dev.sh --smoke

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://planner:planner@localhost:5432/planner_test
      BOT_TOKEN: ci-placeholder-not-a-token
      MINIMAX_API_KEY: ci-placeholder-not-a-key
      ALLOW_ALL_USERS: "true"
      RUN_DB_TESTS: "1"
      BACKUP_DIR: /tmp/dailyplanner-backups
      OPERATOR_DATABASE_URL: postgresql://planner_recovery:planner_recovery@localhost:5432/postgres
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Lint all supported code
        run: uv run ruff check .
      - name: Reject new complexity exceptions
        run: uv run python scripts/check_complexity_ratchet.py
      - name: Validate active documentation links
        run: uv run python scripts/check_documentation.py
      - name: Validate version and changelog consistency
        run: uv run python scripts/check_version_consistency.py
      - name: ShellCheck operational scripts
        run: shellcheck platform/**/*.sh scripts/*.sh
      - name: Typecheck all production and operational code
        run: uv run mypy --explicit-package-bases bot scripts
      - name: Block medium/high-confidence security findings
        run: uv run bandit -q -r bot scripts -x bot/db/migrations -ll
      - name: Audit frozen production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt
      - run: uv run alembic upgrade head
      - name: Reject ORM and migration schema drift
        run: uv run alembic check
      - name: Create least-privilege recovery operator
        run: |
          export PGPASSWORD=planner
          psql -h localhost -U planner -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE planner_recovery LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION PASSWORD 'planner_recovery'"
          createdb -h localhost -U planner --maintenance-db postgres \
            --template template0 dailyplanner_recovery_template
          psql -h localhost -U planner -d dailyplanner_recovery_template \
            -v ON_ERROR_STOP=1 -c \
            "BEGIN;
             ALTER ROLE planner_recovery SUPERUSER;
             SET ROLE planner_recovery;
             CREATE EXTENSION vector;
             CREATE EXTENSION pg_trgm;
             CREATE EXTENSION pgcrypto;
             RESET ROLE;
             ALTER ROLE planner_recovery NOSUPERUSER NOCREATEROLE NOREPLICATION;
             COMMIT"
          psql -h localhost -U planner -d postgres -v ON_ERROR_STOP=1 -c \
            "UPDATE pg_database SET datistemplate=true, datallowconn=false WHERE datname='dailyplanner_recovery_template'"
      - name: Require a single Alembic head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Test with coverage floor
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload machine-readable coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dailyplanner-coverage
          path: coverage.xml
          retention-days: 30
      - name: Enforce critical-path coverage
        run: scripts/check_critical_coverage.sh
      - name: Enforce central-runtime risk coverage ratchets
        run: scripts/check_risk_coverage.sh
      - run: uv run python scripts/evaluate_llm_contracts.py
      - name: Create and restore a real backup
        run: |
          backup="$(uv run python -c 'import asyncio; from bot.scheduler.backup import run_backup; print(asyncio.run(run_backup()))')"
          uv run python scripts/restore_drill.py --backup "$backup"
      - run: uv run python scripts/secret_scan.py

  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: container-smoke
      BOT_TOKEN: container-smoke
      OPENAI_API_KEY: container-smoke
      EMBEDDING_API_KEY: container-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and wait for application readiness
        run: >-
          docker compose -p dailyplanner-ci
          -f platform/linux/docker-compose.yml
          -f platform/linux/docker-compose.smoke.yml
          up --build --wait --wait-timeout 240
      - name: Exercise the readiness probe explicitly
        run: docker exec dailyplanner-ci-bot-1 python scripts/container_healthcheck.py
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: dailyplanner-ci-bot:latest
          format: cyclonedx-json
          output-file: dailyplanner.sbom.cdx.json
          upload-artifact: false
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dailyplanner-sbom
          path: dailyplanner.sbom.cdx.json
          retention-days: 30
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dailyplanner-ci-bot:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Preserve container diagnostics
        if: always()
        run: >-
          docker compose -p dailyplanner-ci
          -f platform/linux/docker-compose.yml
          -f platform/linux/docker-compose.smoke.yml
          logs --no-color
      - name: Remove disposable containers and volumes
        if: always()
        run: >-
          docker compose -p dailyplanner-ci
          -f platform/linux/docker-compose.yml
          -f platform/linux/docker-compose.smoke.yml
          down --volumes --remove-orphans

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  canonical-local-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Run the documented disposable PostgreSQL quality gate
        env:
          DAILYPLANNER_SKIP_STT_EXTRA: "1"
        run: scripts/run_local_test_gate.sh
      - name: Upload canonical-gate coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dailyplanner-canonical-gate-coverage
          path: coverage.xml
          retention-days: 30
