name: Release evidence

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Validate tag, package version and changelog
        run: uv run python scripts/check_version_consistency.py
      - name: Build release image
        run: docker build -f platform/linux/Dockerfile -t "dailyplanner:${GITHUB_REF_NAME}" .
      - name: Save release image
        run: docker save "dailyplanner:${GITHUB_REF_NAME}" -o dailyplanner-image.tar
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: dailyplanner:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: dailyplanner.sbom.cdx.json
          upload-artifact: false
      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dailyplanner:${{ github.ref_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Attest image archive provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dailyplanner-image.tar
      - name: Create checksums
        run: >-
          sha256sum
          dailyplanner-image.tar
          dailyplanner.sbom.cdx.json
          "${{ steps.provenance.outputs.bundle-path }}"
          > SHA256SUMS
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dailyplanner-${{ github.ref_name }}
          path: |
            dailyplanner-image.tar
            dailyplanner.sbom.cdx.json
            ${{ steps.provenance.outputs.bundle-path }}
            SHA256SUMS
          retention-days: 90
      - name: Publish durable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dailyplanner-image.tar \
            dailyplanner.sbom.cdx.json \
            "${{ steps.provenance.outputs.bundle-path }}" \
            SHA256SUMS \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "DailyPlanner $GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq .immutable)" = true
