name: Release evidence

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build release image
        run: docker build -f platform/linux/Dockerfile -t "dailyplanner:${GITHUB_REF_NAME}" .
      - name: Save release image
        run: docker save "dailyplanner:${GITHUB_REF_NAME}" -o dailyplanner-image.tar
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: dailyplanner:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: dailyplanner.sbom.cdx.json
          upload-artifact: false
      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dailyplanner:${{ github.ref_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Create checksums
        run: sha256sum dailyplanner-image.tar dailyplanner.sbom.cdx.json > SHA256SUMS
      - name: Attest image archive provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dailyplanner-image.tar
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dailyplanner-${{ github.ref_name }}
          path: |
            dailyplanner-image.tar
            dailyplanner.sbom.cdx.json
            SHA256SUMS
          retention-days: 90
