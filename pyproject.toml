[project]
name = "dailyplanner"
version = "0.5.0"
description = "Telegram daily planner with reminders and LLM-assisted intent handling"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "kravdim" }]
maintainers = [{ name = "kravdim" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Other Environment",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
  "Typing :: Typed",
]
dependencies = [
  "aiogram>=3.4",
  "aiohttp-socks",
  "alembic",
  "anyio",
  "asyncpg",
  "httpx[socks]",
  "json-repair",
  "openai",
  "pendulum",
  "pgvector",
  "pydantic-settings",
  "pyyaml",
  "sqlalchemy[asyncio]>=2.0",
  "tiktoken",
]

[project.urls]
Homepage = "https://github.com/kravdim/telegram-notebook-bot"
Repository = "https://github.com/kravdim/telegram-notebook-bot"
Issues = "https://github.com/kravdim/telegram-notebook-bot/issues"
Changelog = "https://github.com/kravdim/telegram-notebook-bot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
stt = ["faster-whisper"]

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "mypy",
  "pip-audit>=2.10.1",
  "pytest",
  "pytest-asyncio",
  "pytest-cov>=7.1.0",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C90", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 20
max-returns = 12
max-statements = 80

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = true
exclude = ["bot/db/migrations"]

[[tool.mypy.overrides]]
module = [
  "bot.application.*",
]
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["bot", "scripts"]
omit = ["bot/db/migrations/*"]

[tool.coverage.report]
fail_under = 71
show_missing = true
skip_covered = true
