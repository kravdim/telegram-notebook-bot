[project]
name = "dailyplanner"
version = "0.1.0"
description = "Telegram daily planner with reminders and LLM-assisted intent handling"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.4",
  "aiohttp-socks",
  "alembic",
  "anyio",
  "apscheduler>=3.10",
  "asyncpg",
  "httpx[socks]",
  "json-repair",
  "openai",
  "pendulum",
  "pgvector",
  "pydantic-settings",
  "pyyaml",
  "sqlalchemy[asyncio]>=2.0",
  "tiktoken",
]

[project.optional-dependencies]
stt = ["faster-whisper"]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = true
exclude = ["bot/db/migrations"]
