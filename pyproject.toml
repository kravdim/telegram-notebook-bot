[project]
name = "dailyplanner"
version = "0.2.0"
description = "Telegram daily planner with reminders and LLM-assisted intent handling"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.4",
  "aiohttp-socks",
  "alembic",
  "anyio",
  "apscheduler>=3.10",
  "asyncpg",
  "httpx[socks]",
  "json-repair",
  "openai",
  "pendulum",
  "pgvector",
  "pydantic-settings",
  "pyyaml",
  "sqlalchemy[asyncio]>=2.0",
  "tiktoken",
]

[project.optional-dependencies]
stt = ["faster-whisper"]

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "mypy",
  "pip-audit>=2.10.1",
  "pytest",
  "pytest-asyncio",
  "pytest-cov>=7.1.0",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = true
exclude = ["bot/db/migrations"]

[tool.coverage.run]
source = ["bot", "scripts"]
omit = ["bot/db/migrations/*"]

[tool.coverage.report]
fail_under = 45
show_missing = true
skip_covered = true
